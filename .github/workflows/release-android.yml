name: Build the Android release bundle

# The maintainer's checkout lives under a path with non-ASCII characters,
# which the Android Gradle Plugin refuses to build in (see the README). CI runs
# on an ASCII path, so this is the reliable way to produce the .aab that gets
# uploaded to Google Play.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_PASSWORD      key password (same as the store password here)
#   ANDROID_KEY_ALIAS         key alias, `upload`
#
# Without them the build stops before Gradle rather than quietly shipping an
# artifact signed with the debug key, which Play would reject.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, as name+code (e.g. 1.0.0+1). Blank uses pubspec.yaml.'
        required: false
        default: ''

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # The same gate the Pages deploy uses: a release must not ship code that
      # fails analysis or tests.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release signing secrets before running this workflow."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload-keystore.jks"
          {
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS}"
            printf 'storeFile=%s\n' "${RUNNER_TEMP}/upload-keystore.jks"
          } > android/key.properties

      - name: Build the app bundle
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -n "${VERSION}" ]; then
            flutter build appbundle --release \
              --build-name "${VERSION%%+*}" --build-number "${VERSION##*+}"
          else
            flutter build appbundle --release
          fi

      # A bundle signed with the debug key installs and runs, so the only way
      # to notice before Play rejects it is to check the signer here.
      - name: Verify the bundle is signed with the upload key
        run: |
          set -euo pipefail
          BUNDLE=build/app/outputs/bundle/release/app-release.aab
          BUNDLE_SHA256=$(keytool -printcert -jarfile "$BUNDLE" \
            | grep -m1 'SHA256:' | tr -d ' \t' | cut -d: -f2-)
          KEY_SHA256=$(keytool -list -v \
            -keystore "${RUNNER_TEMP}/upload-keystore.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            | grep -m1 'SHA256:' | tr -d ' \t' | cut -d: -f2-)
          echo "bundle signer: ${BUNDLE_SHA256}"
          if [ "${BUNDLE_SHA256}" != "${KEY_SHA256}" ]; then
            echo "::error::The bundle was not signed with the upload key (probably the debug key)."
            exit 1
          fi

      - name: Clean up the signing material
        if: always()
        run: rm -f android/key.properties "${RUNNER_TEMP}/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
